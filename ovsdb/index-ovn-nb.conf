# index-ovn-nb.conf — Index configuration for OVN_Northbound.
#
# Auto-generated from ovn-nb.ovsschema.
# Schema-declared indexes (e.g., indexes:[["name"]]) are created
# automatically.  This file adds bloom control and extra indexes.
#
# Usage:
#   ovsdb-server --index-config=index-ovn-nb.conf nb.db

# --- Tiny tables (maxRows=1): disable bloom. ---

[NB_Global]
bloom = false

[SSL]
bloom = false

# --- Tables WITH schema indexes (hash auto-created). ---
# Listed for completeness — no extras needed.

# [Copp]
# schema: indexes:[["name"]]  → hash=name auto-created

# [Logical_Switch_Port]
# schema: indexes:[["name"]]

# [Address_Set]
# schema: indexes:[["name"]]

# [Port_Group]
# schema: indexes:[["name"]]

# [Load_Balancer_Group]
# schema: indexes:[["name"]]

# [Mirror]
# schema: indexes:[["name"]]

# [Meter]
# schema: indexes:[["name"]]

# [Logical_Router_Port]
# schema: indexes:[["name"]]

# [Connection]
# schema: indexes:[["target"]]

# [Gateway_Chassis]
# schema: indexes:[["name"]]

# [HA_Chassis_Group]
# schema: indexes:[["name"]]

# [Chassis_Template_Var]
# schema: indexes:[["chassis"]]

# --- Tables WITHOUT schema indexes. ---
# Add hash indexes for commonly queried columns.

[Logical_Switch]
hash = name

[Logical_Router]
hash = name

[Load_Balancer]
hash = name

[NAT]
hash = external_ip

[ACL]
hash = direction

# --- Multi-column schema indexes (skipped by engine). ---
# [BFD]
# schema: indexes:[["logical_port","dst_ip"]]  → multi-col, skipped
# [Static_MAC_Binding]
# schema: indexes:[["logical_port","ip"]]  → multi-col, skipped
