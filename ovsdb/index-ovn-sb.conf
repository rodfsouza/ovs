# index-ovn-sb.conf — Index configuration for OVN_Southbound.
#
# Auto-generated from ovn-sb.ovsschema.
# Schema-declared indexes are created automatically.
# This file adds bloom control and extra indexes.
#
# Usage:
#   ovsdb-server --index-config=index-ovn-sb.conf sb.db

# --- Tiny tables (maxRows=1): disable bloom. ---

[SB_Global]
bloom = false

[SSL]
bloom = false

# --- Tables WITH schema indexes (hash auto-created). ---

# [Chassis]
# schema: indexes:[["name"]]

# [Chassis_Private]
# schema: indexes:[["name"]]

# [Address_Set]
# schema: indexes:[["name"]]

# [Port_Group]
# schema: indexes:[["name"]]

# [Mirror]
# schema: indexes:[["name"]]

# [Meter]
# schema: indexes:[["name"]]

# [Connection]
# schema: indexes:[["target"]]

# [Gateway_Chassis]
# schema: indexes:[["name"]]

# [HA_Chassis_Group]
# schema: indexes:[["name"]]

# [IP_Multicast]
# schema: indexes:[["datapath"]]  → UUID type, auto-created

# [Chassis_Template_Var]
# schema: indexes:[["chassis"]]

# --- Tables WITHOUT schema indexes — add useful hash indexes. ---

[Logical_Flow]
hash = logical_datapath

[Logical_DP_Group]
hash = name

[Load_Balancer]
hash = name

# --- Tables with only multi-column indexes (skipped). ---

# [Encap]
# schema: indexes:[["type","ip"]]  → multi-col, skipped

# [Multicast_Group]
# schema: indexes:[["datapath","tunnel_key"],["datapath","name"]]

# [Datapath_Binding]
# schema: indexes:[["tunnel_key"]]  → integer type, auto-created

# [Port_Binding]
# schema: indexes:[["datapath","tunnel_key"],["logical_port"]]
# "logical_port" is single-col string → auto-created

# [MAC_Binding]
# schema: indexes:[["logical_port","ip"]]  → multi-col, skipped

# [IGMP_Group]
# schema: indexes:[["address","datapath","chassis"]]  → multi-col

# [Service_Monitor]
# schema: indexes:[["logical_port","ip","port","protocol"]]  → multi-col

# [BFD]
# schema: indexes:[["logical_port","dst_ip","src_port","disc"]]  → multi-col

# [FDB]
# schema: indexes:[["mac","dp_key"]]  → multi-col

# [Static_MAC_Binding]
# schema: indexes:[["logical_port","ip"]]  → multi-col
